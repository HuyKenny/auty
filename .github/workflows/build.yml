name: build
# Nightly: fetch affiliate feeds -> build the static site -> deploy Workers static assets -> keep state as a release asset.
# PUBLIC repo: logs are public. Never print feed URLs, keys or raw data; state is encrypted with STATE_KEY.
on:
  schedule:
    - cron: "20 1 * * *"   # daily 02:20 CET — public repo, Actions minutes are free
  workflow_dispatch:
    inputs:
      fetch:
        description: "Fetch fresh feeds (off = rebuild from the last feeds, ~10 min faster)"
        type: boolean
        default: true
concurrency:
  group: build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTY_ENV: ${{ vars.AUTY_ENV || 'staging' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore state (encrypted; stable slugs, last feeds)
        run: scripts/state.sh pull
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: Fetch feeds
        if: github.event_name != 'workflow_dispatch' || inputs.fetch
        timeout-minutes: 20
        continue-on-error: true   # a stuck network falls back to the restored last feeds
        run: python3 scripts/fetch.py
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_CID: ${{ secrets.CJ_CID }}
          CJ_PID: ${{ secrets.CJ_PID }}
          AFFILIATEPORT_API_KEY_FULL: ${{ secrets.AFFILIATEPORT_API_KEY_FULL }}
          FEEDS_JSON: ${{ secrets.FEEDS_JSON }}
      - name: Build site
        run: python3 scripts/build.py
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - name: Secret check (repo + dist)
        run: python3 scripts/verify_no_secrets.py
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AFFILIATEPORT_API_KEY_FULL: ${{ secrets.AFFILIATEPORT_API_KEY_FULL }}
          FEEDS_JSON: ${{ secrets.FEEDS_JSON }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: Deploy
        run: npx --yes wrangler@4.151.3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save state (encrypted)
        run: scripts/state.sh push
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: IndexNow
        if: env.AUTY_ENV == 'production'
        run: python3 scripts/indexnow.py
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - name: Summary
        if: always()
        run: |
          echo '### Fetch' >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; cat data/raw/fetch-report.json >> $GITHUB_STEP_SUMMARY 2>/dev/null; echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### Build' >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; cat data/state/build-report.json >> $GITHUB_STEP_SUMMARY 2>/dev/null; echo '```' >> $GITHUB_STEP_SUMMARY
